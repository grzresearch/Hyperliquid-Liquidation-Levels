[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperliquid-liquidation-levels"
version = "0.1.0"
description = "Liquidation level heatmaps for Hyperliquid perpetual markets"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "cachetools>=5.3.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "rich>=13.7.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
hyperliquid-liquidation = "hyperliquid_liquidation.main:main"

[project.urls]
Repository = "https://github.com/grzresearch/Hyperliquid-Liquidation-Levels"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
